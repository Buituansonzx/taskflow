services:
  # ────────────────────────────────────────────
  # Nginx - Web server
  # ────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: taskflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - taskflow

  # ────────────────────────────────────────────
  # PHP-FPM - Laravel app
  # ────────────────────────────────────────────
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: taskflow_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - PHP_OPCACHE_ENABLE=0 # tắt opcache khi dev để hot reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskflow

  # ────────────────────────────────────────────
  # PostgreSQL - Database
  # ────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: taskflow_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-taskflow}
      POSTGRES_USER: ${DB_USERNAME:-taskflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-taskflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskflow

  # ────────────────────────────────────────────
  # Redis - Cache & Queue
  # ────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: taskflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskflow

  # ────────────────────────────────────────────
  # Queue Worker - Process jobs (email, etc.)
  # ────────────────────────────────────────────
  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: taskflow_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskflow

  # ────────────────────────────────────────────
  # Scheduler - Laravel cron jobs
  # ────────────────────────────────────────────
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: taskflow_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction && sleep 60; done"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskflow

  # ────────────────────────────────────────────
  # Mailpit - Test email locally (UI tại :8025)
  # ────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: taskflow_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    networks:
      - taskflow

volumes:
  postgres_data:
  redis_data:

networks:
  taskflow:
    driver: bridge
